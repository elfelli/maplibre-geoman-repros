<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geoman reproduction</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; font-family: sans-serif; }
      #map { position: absolute; inset: 0; }
      /* An application toolbar laid over the map, outside the map container (a common layout). */
      #toolbar { position: absolute; top: 12px; right: 12px; width: 160px; height: 240px; background: rgba(255, 255, 255, 0.9);
                 border: 1px solid #999; border-radius: 4px; padding: 8px; box-sizing: border-box; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="toolbar">App toolbar (outside the map container)</div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
