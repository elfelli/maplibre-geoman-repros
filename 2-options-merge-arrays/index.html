<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geoman reproduction</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; font-family: sans-serif; }
      .map { position: absolute; top: 0; bottom: 0; width: 50%; }
      #map-a { left: 0; }
      #map-b { right: 0; border-left: 1px solid #999; }
      #log { position: absolute; left: 8px; bottom: 8px; max-width: 90%; max-height: 50%; overflow: auto; margin: 0;
             padding: 8px; font: 12px/1.4 monospace; background: rgba(255,255,255,.92); white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="map-a" class="map"></div>
    <div id="map-b" class="map"></div>
    <pre id="log"></pre>
    <script type="module" src="/main.js"></script>
  </body>
</html>
